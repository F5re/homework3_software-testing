name: PR Fast CI

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-fast-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect_changes:
    name: Detect changed risk areas
    runs-on: ubuntu-latest
    outputs:
      critical_integration: ${{ steps.detect.outputs.critical_integration }}
      docker: ${{ steps.detect.outputs.docker }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: detect
        name: Select risk-based checks
        shell: bash
        run: |
          set -euo pipefail

          # Merge queue validates the combined candidate, so use the conservative set.
          if [[ "${{ github.event_name }}" == "merge_group" ]]; then
            echo "critical_integration=true" >> "$GITHUB_OUTPUT"
            echo "docker=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch origin "${{ github.base_ref }}" --depth=1
          files="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")"
          printf '%s\n' "$files"

          critical=false
          docker=false

          if grep -Eq '^(src/main/java/booking/(bookings|rooms|common|notifications)/|src/test/java/booking/integration/|pom\.xml)' <<< "$files"; then
            critical=true
          fi

          if grep -Eq '^(Dockerfile|pom\.xml|src/main/resources/)' <<< "$files"; then
            docker=true
          fi

          echo "critical_integration=$critical" >> "$GITHUB_OUTPUT"
          echo "docker=$docker" >> "$GITHUB_OUTPUT"

  checkstyle:
    name: PR / Checkstyle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B checkstyle:check

  spotbugs:
    name: PR / SpotBugs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B spotbugs:check

  build:
    name: PR / Maven build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B -DskipTests package

  unit:
