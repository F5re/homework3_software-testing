name: Release to PROD

on:
  workflow_dispatch:
    inputs:
      image_sha:
        description: "Full Git SHA already built from main"
        required: true
        type: string
      major_release:
        description: "Require load test before PROD"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: read

jobs:
  validate_candidate:
    name: Release / Validate candidate
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate SHA belongs to main
        shell: bash
        run: |
          set -euo pipefail
          sha="${{ inputs.image_sha }}"
          [[ "$sha" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "image_sha must be a full 40-char Git SHA"; exit 1; }
          git fetch origin main
          git merge-base --is-ancestor "$sha" origin/main

      - id: meta
        shell: bash
        run: |
          owner="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/booking-service:${{ inputs.image_sha }}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "IMAGE=$image" >> "$GITHUB_ENV"

      - name: Verify immutable image exists
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull "$IMAGE"

  preprod:
    name: Release / PREPROD verification
    needs: validate_candidate
    runs-on: ubuntu-latest
    environment:
      name: preprod
      deployment: true
    concurrency:
      group: preprod-environment
      queue: max
    env:
      IMAGE: ${{ needs.validate_candidate.outputs.image }}
      PREPROD_BASE_URL: ${{ vars.PREPROD_BASE_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Deploy release candidate
        run: ./ci/deploy-preprod.sh "$IMAGE"

      - name: API regression
        run: mvn -B -Papi -DbaseUrl="$PREPROD_BASE_URL" verify

      - name: Critical E2E regression
        run: mvn -B -Pe2e -Dgroups=e2e-stable -DbaseUrl="$PREPROD_BASE_URL" verify

      - name: Recurring booking critical scenarios
        run: mvn -B -Pintegration -Dgroups=recurring-critical verify

      - name: Multi-instance booking concurrency
        run: mvn -B -Pintegration -Dgroups=distributed-booking-critical verify

      - name: Kafka duplicate/loss/idempotency scenarios
        run: mvn -B -Pintegration -Dgroups=kafka-critical verify

      - name: Major-release load gate
        if: inputs.major_release
        run: mvn -B -Pload -DbaseUrl="$PREPROD_BASE_URL" verify

  production:
    name: PROD / Manual protected deployment
    needs: [validate_candidate, preprod]
    runs-on: ubuntu-latest
    environment:
      name: production
      deployment: true
    concurrency:
      group: production-environment
      queue: max
    env:
      IMAGE: ${{ needs.validate_candidate.outputs.image }}
      PROD_BASE_URL: ${{ vars.PROD_BASE_URL }}
    steps:
      - uses: actions/checkout@v7

      - name: Deploy the same immutable image
        run: ./ci/deploy-prod.sh "$IMAGE"

      - name: Post-deploy smoke
        run: ./ci/prod-smoke.sh "$PROD_BASE_URL"
